name: adhisaat_health_care
description: "A Health Care App."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.10+14

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8


  image_picker: ^1.2.1
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  flutter_widget_from_html: ^0.16.0

  #Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^6.0.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1

  get_it: ^9.2.0

  table_calendar: ^3.1.3

  # HTTP
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  path: ^1.9.1
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  pdf: ^3.11.1

  # Audio
  audioplayers: ^6.1.0

  # Auto Update
  in_app_update: ^4.2.5
  upgrader: ^12.5.0

  awesome_notifications: ^0.10.1
  firebase_core: ^4.4.0
  sms_autofill: ^2.4.1
  device_info_plus: ^11.2.0

  google_fonts: ^8.0.0
  shimmer: ^3.0.0
  dropdown_button2: ^2.3.9

  # Google Maps
  google_maps_flutter: ^2.16.0
  google_maps_flutter_ios_sdk9: ^2.18.0
  google_places_flutter: ^2.1.1 #AutoComplete TextField location search

  # Location services
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Navigation
  url_launcher: ^6.3.2

  # Permissions
  permission_handler: ^12.0.1

  # Notifications
  firebase_messaging: ^16.1.1
  #  flutter_local_notifications: ^20.0.0

  flutter_flavor: ^3.1.4

  # Real-time
  cloud_firestore: ^6.1.2

  flutter_hooks: ^0.21.3+1

  connectivity_plus: ^6.1.1    # Check WiFi/Mobile data
  internet_connection_checker: ^3.0.1  # Verify actual internet
#  location: ^8.0.1
  place_picker_google:
    path: ./packages/place_picker_google

  share_plus: ^12.0.2
  razorpay_flutter: ^1.4.1
  package_info_plus: ^9.0.0
#  auto_hide_keyboard: ^1.1.1
  webview_flutter: ^4.13.1
  super_tooltip: ^2.1.1

  flutter_native_splash: ^2.4.7
  lottie: ^3.3.2
  firebase_crashlytics: ^5.1.0
  firebase_analytics: ^12.4.1
  firebase_auth: ^6.3.0
  app_links: ^7.0.0
  facebook_app_events: ^0.19.4

  uuid: ^4.5.1
dependency_overrides:
  # google_maps_apis 4.0.0 (used by map_location_picker) doesn't implement
  # the {Response? response} named param added in retrofit >=4.9.0.
  # Pin retrofit to the last compatible version until map_location_picker
  # or google_maps_apis ships a fix.
  retrofit: 4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/images/partner_onboarding/
    - assets/images/user_onboarding/
    - assets/sounds/
    - .env

